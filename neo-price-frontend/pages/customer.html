<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" href="../images/favicon.png" type="image/jpg">
  <link rel="stylesheet" href="/css/style.css">
  <script src="../js/auth.js" defer></script>
  <script src="../js/customer.js" defer></script>
  <title>NeoPrice - Calculator</title>
</head>

<body>

  <div class="left">

    <h2>
      <a href="../index.html">NeoPrice</a>
    </h2>

    <nav>

      <ul>

        <li>
          <a href="/pages/calculator.html">
            Calculadora
          </a>
        </li>

        <li>
          <a href="/pages/pricingHistory.html">
            Histórico
          </a>
        </li>

        <li>
          <a>
            Clientes
          </a>
        </li>

        <li>
          <a href="#" id="logoutButton">
            Sair
          </a>
        </li>
      </ul>

    </nav>

  </div>

  <div class="right">

    <div class="welcome">

      <h1>Clientes</h1>

      <p class="pages-subtitles">
        Gerencie os clientes cadastrados no sistema.
      </p>

    </div>

    <div class="customer-form-container">

      <div class="card">

        <h3>Novo Cliente</h3>

        <form id="customerForm">

          <div class="form-group">

            <label>Nome</label>

            <input type="text" id="name" placeholder="Nome do cliente">

          </div>

          <div class="form-group">

            <label>Empresa</label>

            <input type="text" id="companyName" placeholder="Nome da empresa">

          </div>

          <button type="submit">
            Salvar Cliente
          </button>

        </form>

      </div>

    </div>

    <div class="customer-list-container">

      <div class="card">

        <h3>Clientes Cadastrados</h3>

        <table>

          <thead>

            <tr>
              <th>Nome</th>
              <th>Empresa</th>
              <th>Ações</th>
            </tr>

          </thead>

          <tbody id="customerTableBody">

          </tbody>

        </table>

      </div>

    </div>

  </div>

</body>

</html>
